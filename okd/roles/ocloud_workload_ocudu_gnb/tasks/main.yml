---
- name: Create staging dir
  ansible.builtin.tempfile:
    path: "{{ lookup('env', 'HOME') }}"
    prefix: "ocloud_workload_ocudu_gnb.{{ ansible_date_time['date'] }}."
    state: directory
  register: ocloud_workload_ocudu_gnb_staging_dir

- name: Download Helm
  ansible.builtin.get_url:
    url: "{{ ocloud_workload_ocudu_gnb_helm_url }}"
    dest: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/helm-linux-amd64.tar.gz"

- name: Create helm directory
  ansible.builtin.file:
    path: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/helm"
    state: directory

- name: Extract Helm
  ansible.builtin.unarchive:
    src: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/helm-linux-amd64.tar.gz"
    dest: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/helm"
    remote_src: true

- name: Clone charts repo
  ansible.builtin.git:
    repo: "{{ ocloud_workload_ocudu_gnb_repo_url }}"
    version: "{{ ocloud_workload_ocudu_gnb_repo_version }}"
    dest: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/git"
    recursive: false

- name: Deploy ocudu-gnb Helm chart
  kubernetes.core.helm:
    name: ocudu-gnb
    chart_ref: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/git/charts/ocudu-gnb"
    release_namespace: "{{ ocloud_workload_ocudu_gnb_namespace }}"
    create_namespace: true
    values:
      config:
        gnb-config.yml: "{{ lookup('template', 'gnb-config.yml.j2') | from_yaml }}"
      resources:
        limits:
          "{{ ocloud_workload_ocudu_gnb_sriov_resource }}": 1
        requests:
          "{{ ocloud_workload_ocudu_gnb_sriov_resource }}": 1
      sriovConfig:
        enabled: true
        extendedResourceName: "{{ ocloud_workload_ocudu_gnb_sriov_resource }}"
    kubeconfig: "{{ ocloud_dms_kubeconfig }}"
    binary_path: "{{ ocloud_workload_ocudu_gnb_staging_dir['path'] }}/helm/linux-amd64/helm"
    state: present
