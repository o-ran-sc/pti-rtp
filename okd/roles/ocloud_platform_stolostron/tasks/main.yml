---
- name: Disable default catalog sources
  kubernetes.core.k8s:
    api_version: config.openshift.io/v1
    kind: OperatorHub
    name: cluster
    namespace: default
    state: patched
    definition:
      spec:
        disableAllDefaultSources: true
    kubeconfig: "{{ ocloud_kubeconfig }}"

- name: Clone stolostron/deploy repo
  ansible.builtin.git:
    repo: "{{ ocloud_platform_stolostron_repo_url }}"
    dest: "{{ ocloud_staging_dir['path'] }}/git/stolostron-deploy"

- name: Template pull secret
  ansible.builtin.template:
    src: "pull-secret.yaml.j2"
    dest: "{{ ocloud_staging_dir['path'] }}/git/stolostron-deploy/prereqs/pull-secret.yaml"

- name: Template snapshot version
  ansible.builtin.template:
    src: "snapshot.ver.j2"
    dest: "{{ ocloud_staging_dir['path'] }}/git/stolostron-deploy/snapshot.ver"

- name: Install stolostron
  ansible.builtin.shell:
    chdir: "{{ ocloud_staging_dir['path'] }}/git/stolostron-deploy"
    cmd: "./start.sh --silent --watch --search"
  environment:
    PATH: "{{ ocloud_staging_dir['path'] }}/bin:{{ ansible_env.PATH }}"
    KUBECONFIG: "{{ ocloud_kubeconfig }}"

- name: Create search-api route
  kubernetes.core.k8s:
    api_version: route.openshift.io/v1
    kind: Route
    name: search-api
    namespace: open-cluster-management
    state: present
    definition:
      spec:
        tls:
          termination: reencrypt
        to:
          kind: Service
          name: search-search-api
    kubeconfig: "{{ ocloud_kubeconfig }}"

- name: Create AgentServiceConfig
  kubernetes.core.k8s:
    template: "agent-service-config.yaml.j2"
    state: present
    kubeconfig: "{{ ocloud_kubeconfig }}"

- name: Get MultiClusterHub
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    name: multiclusterhub
    kubeconfig: "{{ ocloud_kubeconfig }}"
  register: ocloud_platform_stolostron_multiclusterhub

- name: Check if siteconfig is already enabled
  ansible.builtin.set_fact:
    ocloud_platform_stolostron_siteconfig_enabled: >-
      {{ ocloud_platform_stolostron_multiclusterhub['resources'][0]['spec']['overrides']['components']
         | selectattr('name', 'equalto', 'siteconfig')
         | selectattr('enabled', 'equalto', true)
         | list | length > 0 }}

- name: Build updated components list with siteconfig enabled
  ansible.builtin.set_fact:
    ocloud_platform_stolostron_components_updated: >-
      {{ (ocloud_platform_stolostron_multiclusterhub['resources'][0]['spec']['overrides']['components']
          | rejectattr('name', 'equalto', 'siteconfig') | list)
         + [{'name': 'siteconfig', 'enabled': true}] }}
  when: not (ocloud_platform_stolostron_siteconfig_enabled | bool)

- name: Enable siteconfig in MultiClusterHub (atomic operation)
  kubernetes.core.k8s:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: multiclusterhub
    namespace: open-cluster-management
    state: present
    definition:
      spec:
        overrides:
          components: "{{ ocloud_platform_stolostron_components_updated }}"
    kubeconfig: "{{ ocloud_kubeconfig }}"
  when: not (ocloud_platform_stolostron_siteconfig_enabled | bool)
